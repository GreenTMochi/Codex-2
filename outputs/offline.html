          { id: "v225-blank-assessment-duplicate", version: 225, date: "2026-09-25", type: "New feature", title: "Blank duplicates in Assessment", summary: "Create fresh blocks directly from Pre-assessment or Post-assessment.", changes: ["Keep the subject, unit, and assessment mode with empty content, confidence, and completed history.", "Optionally copy scheduled revision dates, then open the new block immediately.", "Inherited presets and blueprints remain available."] },
          { id: "v224-block-blueprint-removal", version: 224, date: "2026-09-23", type: "Improvement", title: "Remove blueprints from a block", summary: "Blueprint cards can be removed from an individual block with two confirmations.", changes: ["Use the trash button in the blueprint panel to remove an entry and its copies from this block.", "Removing an added blueprint technique also requires two confirmations.", "Shared blueprints, other blocks, and completed revision history remain saved."] },
          { id: "v223-blank-mle-duplicate", version: 223, date: "2026-09-23", type: "New feature", title: "Blank duplicates from MLE", summary: "Create a fresh block for separate content directly from an MLE row or open block.", changes: ["Keep the subject, unit, and MLE date; enter a new name and open the new block immediately.", "Content and completed history start empty, with Pre-study skipped and inherited presets and blueprints available."] },
          { id: "v222-blueprints-with-presets", version: 222, date: "2026-09-23", type: "Fix", title: "Blueprints stay visible with presets", summary: "Unused preset techniques no longer hide blueprints on new blocks.", changes: ["Both permanent and scheduled bundles can appear alongside the blueprint panel.", "Actual block content, technique notes, revision history, and Done choosing still control when the panel stays hidden."] },
          { id: "v221-prestudy-overdue-mle", version: 221, date: "2026-09-23", type: "Study improvement", title: "Overdue MLEs stand out in Pre-study", summary: "The Pre-study dropdown turns red when a block inside has an MLE date in the past.", changes: ["An overdue MLE count stays visible while the section is collapsed.", "The warning clears when those blocks leave Pre-study or their MLE dates are moved forward."] },
          { id: "v220-blueprint-highlights", version: 220, date: "2026-09-22", type: "Visual improvement", title: "Spot your blueprints", summary: "Blue highlights show where blueprints are available.", changes: ["Blueprint buttons turn blue when entries are saved or available for pre-study.", "Blueprint entries and techniques added from blueprints have a blue accent.", "Empty blueprint buttons remain neutral."] },
          { id: "v219-mobile-navigation", version: 219, date: "2026-09-22", type: "Mobile improvement", title: "Room to swipe above the home indicator", summary: "Mobile navigation sits in a raised, rounded bar with space below it for phone gestures.", changes: ["Swipe the page tabs above the iPhone home indicator.", "Content and controls respect screen safe areas, with room to scroll the last item above navigation."] },
          { id: "v218-fresh-technique-notes", version: 218, date: "2026-09-19", type: "Fix", title: "Fresh techniques start empty", summary: "New technique entries start with empty notes and keep their own identity.", changes: ["Re-adding a removed technique creates a new note record instead of reopening old notes.", "Manual and blueprint additions stay independent of preset labels and windows.", "Blueprint instructions are no longer copied into technique notes."] },
          { id: "v217-desktop-density", version: 217, date: "2026-09-19", type: "Layout improvement", title: "More visible at normal zoom", summary: "Desktop pages now use the compact scale previously seen at 75% browser zoom.", changes: ["The sidebar, controls, card spacing and block workspace scale together so more information fits at 100% zoom.", "Phone layouts retain their existing sizing."] },
          { id: "v216-cycle-settings-layout", version: 216, date: "2026-09-19", type: "Layout improvement", title: "Readable cycle settings", summary: "The end-of-week cycle explanation has its own full-width row above the controls.", changes: ["Cycle fields fit the available space without squeezing the explanation into a narrow column."] },
          { id: "v215-learning-flow-size", version: 215, date: "2026-09-19", type: "Layout improvement", title: "Learning flow boxes fit their text", summary: "Learning flow steps expand automatically on Home and Study.", changes: ["Saved text and new edits remain fully visible without an internal scrollbar.", "Boxes shrink again when text is removed."] },
          { id: "v214-prestudy-render-fix", version: 214, date: "2026-09-17", type: "Fix", title: "Home and Study load again", summary: "Fixed a page-rendering error introduced by the pre-study Blueprint button.", changes: ["Home and Study now render correctly when active pre-study tasks are present."] },
          { id: "v213-prestudy-blueprints", version: 213, date: "2026-09-17", type: "Planning improvement", title: "Choose blueprints during pre-study", summary: "Open the blueprint panel directly while preparing a block.", changes: ["Pre-study rows and block pages include a Blueprint button, even when presets or notes already exist.", "Add or drag subject and unit entries into their planned sections without replacing existing content or changing revision dates."] },
          { id: "v212-technique-badges-notes", version: 212, date: "2026-09-17", type: "Usability improvement", title: "Clear preset labels and visible notes", summary: "Identical preset and window badges appear once, and techniques with notes stand out.", changes: ["Overlapping assignments share one badge pair while all assignments remain editable.", "Techniques with notes have a blue accent and highlighted Notes button, including shared-pile techniques."] },
          { id: "v211-unit-block-order", version: 211, date: "2026-09-17", type: "Layout improvement", title: "Later revision stages first", summary: "Blocks within each unit in Subjects now show later revision stages first and pre-study last.", changes: ["Each unit and sub-unit sorts its own blocks by progress through the revision stages.", "Blocks at the same stage show earlier MLE dates first."] },
          { id: "v210-preset-assignment-fix", version: 210, date: "2026-09-17", type: "Fix", title: "Preset assignment changes stick", summary: "Reopen saved assignments and change which blocks receive a preset.", changes: ["Existing assignments open with their saved scope and revision windows.", "Narrowing a scope removes its copied techniques from excluded blocks while keeping notes and completed history.", "New assignments require an explicit scope instead of defaulting to all blocks."] },
          { id: "v209-shared-pile-notes", version: 209, date: "2026-09-15", type: "Usability improvement", title: "Notes for shared pile techniques", summary: "Open and edit notes directly from a shared-pile technique row.", changes: ["The Notes panel uses the same rich-text editor and autosave setting as other techniques.", "Pile notes are shared across member blocks and preserved when navigating away."] },
          { id: "v208-pile-member-search", version: 208, date: "2026-09-15", type: "Usability improvement", title: "Find pile members quickly", summary: "Search the member list when editing a Study Pile.", changes: ["Search by block name, subject, or unit.", "Filtering keeps selected members checked, including those outside the results."] },
          { id: "v207-scheduling-history", version: 207, date: "2026-09-15", type: "Scheduling improvement", title: "Revision history while scheduling", summary: "Review past sessions when choosing pre- or post-assessment dates.", changes: ["Unit mode and block date windows include a calendar with recorded confidence and time.", "History is also available on both Assessment tabs, including revisions completed before changing modes.", "Browsing calendar months and days preserves unsaved dates."] },
          { id: "v206-subject-layout", version: 206, date: "2026-09-15", type: "Layout improvement", title: "More room in Subjects", summary: "Subject, unit, and block cards stay readable at normal zoom.", changes: ["Names, status details, and actions have their own consistent rows.", "Badges and buttons wrap as whole items, with less indentation inside units."] },
          { id: "v205-learning-flow", version: 205, date: "2026-09-15", type: "New feature", title: "Your learning flow", summary: "Display your own sequence of connected steps at the top of Home and Study.", changes: ["Enable Learning flow in Settings, then edit boxes and add as many steps as you need.", "Both pages share the same flow, and hiding it preserves your steps."] },
          { id: "v204-optional-maintenance", version: 204, date: "2026-09-15", type: "Workflow improvement", title: "Optional manual maintenance", summary: "Post-assessment uses optional exact revision dates and a history calendar.", changes: ["No exam date or spacing offsets are required for maintenance.", "Blocks without scheduled maintenance stay out of the work list.", "The calendar shows completed revisions with confidence and recorded time."] },
          { id: "v203-block-blueprints", version: 203, date: "2026-09-14", type: "New feature", title: "Blueprints beside empty blocks", summary: "Prepare content and techniques at subject or unit level, then drag them into empty blocks.", changes: ["Entries carry a content name, technique, knowledge type, order, and optional instructions.", "Drops snap to the planned section. Copies can be adjusted independently.", "The panel stays open while choosing and is hidden for blocks with decided content."] },
          { id: "v202-clear-unit-add-actions", version: 202, date: "2026-09-13", type: "Interface improvement", title: "Clear unit creation buttons", summary: "Unit headers label their two creation actions explicitly.", changes: ["Add sub-unit and Add block now have visible text beside the plus icon."] },
          { id: "v201-bulk-assessment-dates", version: 201, date: "2026-09-13", type: "New feature", title: "Assign dates to multiple blocks", summary: "Add revision dates to selected pre-assessment blocks in one step.", changes: ["Select individual blocks, a unit, or all blocks, then enter one or more dates.", "Existing dates and completed history are preserved; duplicate scheduled dates are skipped."] },
          { id: "v200-assessment-completion-badge", version: 200, date: "2026-09-12", type: "Interface improvement", title: "Distinct completion badges", summary: "Pre-assessment completion totals stand out with a blue badge and a bold count.", changes: ["A calendar icon distinguishes completed revision totals from confidence.", "Zero completions use a quieter neutral badge."] },
          { id: "v199-completed-assessment-dates", version: 199, date: "2026-09-12", type: "Interface improvement", title: "Completed revision dates stay visible", summary: "The pre-assessment date editor lists completed revisions alongside upcoming dates.", changes: ["Completed rows show the scheduled date and actual completion date when different.", "Completed history remains read-only while upcoming dates can be edited."] },
          { id: "v198-assessment-completion-count", version: 198, date: "2026-09-12", type: "Interface improvement", title: "Pre-assessment completion counts", summary: "Each pre-assessment block shows how many revisions have been completed.", changes: ["Counts use completed pre-assessment sessions in block history, including pile completions.", "Confidence badges fit their contents without an empty trailing box."] },
          { id: "v197-assessment-confidence-order", version: 197, date: "2026-09-12", type: "Interface improvement", title: "Assessment sorted by confidence", summary: "Assessment blocks appear from lowest to highest confidence within each unit.", changes: ["Both assessment tabs put lower-confidence blocks first, with unrated blocks last.", "Blocks with the same confidence keep their existing relative order."] },
          { id: "v196-assessment-confidence-units", version: 196, date: "2026-09-12", type: "Interface improvement", title: "Assessment confidence and collapsible units", summary: "Assessment blocks show their latest confidence, with compact unit headers that expand and collapse.", changes: ["Confidence stays visible on block headers even when scheduled sessions are closed or more dates are needed.", "Collapse units independently in Pre-assessment and Post-assessment; your choices are remembered."] },
          { id: "v195-collapsible-matrices", version: 195, date: "2026-09-11", type: "Interface improvement", title: "Compact, collapsible matrices", summary: "Matrices now sit in a dense list of expandable rows.", changes: ["Collapsed rows show each matrix name with its element and question-set counts.", "Open one matrix at a time; collapse it again by clicking its header.", "Expansion is remembered, and links from blocks open the matching matrix."] },
          { id: "v194-matrix-drag-handles", version: 194, date: "2026-09-10", type: "Interface improvement", title: "Cleaner Element Matrix controls", summary: "Drag six-dot handles to arrange elements and settings.", changes: ["Replaced builder arrow buttons with drag handles and visible drop positions.", "Made Add setting and remove controls small, labelled icons.", "Simplified column headers, setting rows, and coverage labels."] },
          { id: "v193-element-matrix", version: 193, date: "2026-09-10", type: "New workspace", title: "Element Matrix", summary: "Build matrices and varied question sets, then practise them in their own workspace.", changes: ["Create elements and settings, track setting coverage, and exclude incompatible combinations.", "Write and save questions with routes, diagrams, and hidden solutions; suggestions help find unused valid routes.", "Practise sets or use Full Pass to attempt every question before checking solutions.", "Link matrices to subjects, units, or blocks and keep practice history across devices."] },
          { id: "v192-single-add-technique", version: 192, date: "2026-09-10", type: "Interface fix", title: "One Add technique button in compact view", summary: "Only populated sections now has one clear Add technique action.", changes: ["Removed repeated Add buttons from individual sections and the empty state in compact view.", "The Add technique button lets you choose any knowledge type and LO, MO, or HO level.", "The complete six-section layout keeps its section-specific Add controls."] },
          { id: "v191-testing-zones", version: 191, date: "2026-09-08", type: "Planning improvement", title: "Testing zones for subjects, units, and blocks", summary: "Set a pre-assessment warning period at any level of your subjects.", changes: ["Testing zone start and end dates inherit through subjects, units, sub-units, and blocks.", "More specific dates take precedence, with warnings when parent and child zones differ.", "Active testing zones appear on Home, Study, and Assessment, with badges beside affected content.", "These reminders leave revision schedules and assessment modes under your control."] },
          { id: "v190-assessment-workspace", version: 190, date: "2026-09-08", type: "Organization improvement", title: "A separate Assessment page", summary: "Pre-assessment and post-assessment work now has its own page for scheduling and completion.", changes: ["Added Pre-assessment and Post-assessment tabs, grouped by subject and unit.", "Blocks without scheduled dates remain visible with a Needs dates label.", "Moved assessment revisions, paused assessment work, and related Custom Sessions out of Study.", "Kept completion, date editing, and pile work available on the Assessment page."] },
          { id: "v189-manual-pre-assessment", version: 189, date: "2026-09-08", type: "Scheduling improvement", title: "Individual pre-assessment revision dates", summary: "Switch a unit to pre-assessment and choose exact revision dates separately for every active block, including sub-units.", changes: ["Add one date or unlimited future dates per block, and change the list later.", "Completed sessions stay in history when dates are edited or more dates are added.", "No automatic revision dates are generated after a manual list runs out.", "Dates can be prepared before MLE completion and become active afterward."] },
          { id: "v188-archived-appearance", version: 188, date: "2026-09-08", type: "Visual improvement", title: "Archived content is clearly marked", summary: "Show archived now displays saved content with muted cards, striped backgrounds, dashed borders, and an Archived badge.", changes: ["Archived blocks are visually distinct from active blocks while their names and controls remain readable.", "Archived subjects and units use the same treatment, including content archived through a parent.", "Opening, editing, and restoring archived content still work as before."] },
          { id: "v187-full-pass-piles", version: 187, date: "2026-09-07", type: "Study Piles improvement", title: "Full Pass piles", summary: "Group blocks to attempt every question before checking answers, without choosing a shared technique.", changes: ["Choose Full Pass or Shared Technique when creating or editing a pile.", "Full Pass shows an answer-first reminder on Study cards and the completion screen.", "Each block keeps its own techniques, confidence, time, completion percentage, and progression.", "Full Pass sessions are identified in history; existing shared technique piles and history are preserved."] },
          { id: "v186-completion-percentage-metadata", version: 186, date: "2026-09-06", type: "Critical progression fix", title: "Completion percentage no longer blocks progression", summary: "Completing a revision now always advances its stage; the percentage records how much of the intended session was completed.", changes: ["Made every deliberate Complete action advance the revision stage whether the recorded completion is 1% or 100%.", "Kept completion percentage, confidence, time, notes, gaps, and techniques together in ordinary session history.", "Automatically recovers blocks held back by the old percentage gate by promoting the newest saved attempt exactly once.", "Preserves earlier repeated attempts in history instead of deleting data.", "Applied the same percentage-as-context rule to individual revisions and Study Pile member completion."] },
          { id: "v185-revision-progression-clarity", version: 185, date: "2026-09-05", type: "Critical progression fix", title: "Partial sessions and stage progression are unmistakable", summary: "Study now explains when recorded work is partial and repairs any completed stage restored by stale sync data.", changes: ["Shows the number and latest percentage of partial attempts directly on the active Study card.", "Changes the action to Finish revision after partial work and repeats that 100% is required to advance in the completion form.", "Repairs an active revision task automatically when its exact saved 100% session already proves it was completed.", "Wraps individual completion in a rollback transaction so a failed next-stage calculation cannot leave half-written session data.", "Keeps the existing lower-confidence-first ordering while making the reason a block remains in its current stage visible."] },
          { id: "v184-radiant-logo", version: 184, date: "2026-09-04", type: "Visual update", title: "A brighter learning-to-retrieval logo", summary: "The app logo now carries a continuous golden flow from the book into the central star, then radiates gradually into the blue neural branches.", changes: ["Connected the book and central trunk with a smooth yellow-to-gold transition instead of a visible color seam.", "Made the book-to-star trunk glow subtly while keeping its full line weight.", "Extended the star-centered yellow-to-cyan-to-blue blend farther through the neural branches.", "Updated the sidebar, browser, installed-app, and phone icons together."] },
          { id: "v183-session-completion-percentage", version: 183, date: "2026-09-04", type: "Study tracking", title: "Revision sessions record completion percentage", summary: "Every revision session now defaults to 100% completion, while a lower percentage records the work without falsely advancing the revision stage.", changes: ["Added a Completion percentage field to individual revision completion and each selected Study Pile member, defaulting to 100%.", "Kept partial work as a normal revision session with its own time, confidence, notes, techniques, and date rather than creating a separate session category.", "Made values below 100% leave the same revision stage active so more work can be recorded later.", "Recorded 100% as the explicit signal that completes and advances the stage.", "Added editable completion percentages to session history and protected scheduling, preset, and recovery logic from treating partial sessions as completed stages."] },
          { id: "v182-data-integrity-recovery", version: 182, date: "2026-09-02", type: "Critical data safety fix", title: "Sync, Undo, Notebook recovery, and highlighted deletion are protected", summary: "Future MLEs remain visible, browser tabs sync independently, Undo preserves unrelated newer edits, and prior Notebook copies can be recovered without overwriting the current one first.", changes: ["Added an Upcoming MLE section so changing an MLE to a future date moves it instead of making it appear deleted.", "Gave every open browser tab its own sync identity so concurrent tabs cannot be mistaken for duplicate saves.", "Changed Undo and Redo to reverse only the data changed by that action while retaining unrelated edits made afterward.", "Added recoverable Notebook versions from local action history and durable server snapshots, with previews and explicit restore confirmation.", "Stopped Delete and Backspace from triggering highlight-caret cleanup and merged adjacent same-color highlights to remove visible seams."] },
          { id: "v181-same-week-first-end-week", version: 181, date: "2026-09-01", type: "Scheduling improvement", title: "First 2W stays in the 1-Day completion week", summary: "Completing 1-Day now assigns First 2W to that same calendar week's Friday-through-Sunday window, even when 1-Day is completed during the weekend itself.", changes: ["Removed the global 1M-week exception that could push First 2W into the following weekend.", "Made a Friday, Saturday, or Sunday 1-Day completion reveal First 2W immediately in the still-open weekend.", "Pinned the generated task to that weekend so automatic refreshes cannot move it forward.", "Repaired active automatically assigned First 2W tasks that match the old one-week-late pattern, while preserving manual schedules, completed history, and assessment dates.", "Kept the existing Schedule control as the deliberate way to choose a later date."] },
          { id: "v180-relative-exam-ramp", version: 180, date: "2026-09-01", type: "Timeline improvement", title: "Every exam ramp is relative to its unit runway", summary: "Broad Build, Focused Mix, and Precision Retrieval now divide each unit's complete start-to-assessment span proportionally instead of switching at fixed day counts.", changes: ["Assigned roughly 50% of every runway to Broad Build, 37.5% to Focused Mix, and 12.5% to Precision Retrieval.", "Rounded the relative split to whole calendar days while preserving at least one day per phase whenever three or more days are available.", "Removed the special 56-day threshold and fixed 28-day/7-day phase cutoffs.", "Kept the focus ramp visual-only; Study revision windows, assessment dates, techniques, and saved data are unchanged."] },
          { id: "v179-adaptive-exam-ramp", version: 179, date: "2026-09-01", type: "Timeline improvement", title: "Short exam runways keep a real Broad Build phase", summary: "The Timeline now compresses all three exam-preparation phases proportionally when a unit starts fewer than 56 days before its assessment.", changes: ["Reserved roughly half of short runways for Broad Build instead of omitting it when a unit begins inside the old 28-day cutoff.", "Kept Focused Mix and Precision Retrieval visible after Broad Build, with at least one calendar day per phase whenever the runway is at least three days.", "Preserved the established final-28-day and final-7-day boundaries for unit runways of 56 days or longer.", "Explained the adaptive rule on the Timeline and in phase tooltips; no schedules, techniques, dates, or stored study data were changed."] },
          { id: "v178-reliable-pile-archive", version: 178, date: "2026-09-01", type: "Study Piles fix", title: "Archive Study Pile works immediately", summary: "Confirming Archive now deactivates the pile once, closes its editor, and removes it from active Study views.", changes: ["Centralized archive and restore into one reliable saved-state transition.", "Disabled the Archive button as soon as the confirmed action begins to prevent repeated presses.", "Stored an archive timestamp so active-pile queries cannot accidentally treat the pile as live.", "Kept the pile's setup and shared history available under Archived Piles for restoration or permanent deletion."] },
          { id: "v177-collapsible-pile-selection", version: 177, date: "2026-09-01", type: "Study Piles fix", title: "Study sections stay collapsible during pile selection", summary: "Creating a Study Pile no longer forces every Study section open or ignores collapse clicks.", changes: ["Preserved each Study section's existing collapsed or expanded state when pile selection begins.", "Made section headers continue to collapse and reopen normally while selection mode is active.", "Applied the same behavior to Needs scheduling and Other available blocks.", "Kept blocks inside collapsed sections available to Select all without changing pile membership or study data."] },
          { id: "v176-fixed-assigned-review-weekends", version: 176, date: "2026-08-31", type: "Scheduling fix", title: "Missed 2W and 1M weekends stay overdue", summary: "An unfinished end-week revision now remains attached to its originally assigned weekend instead of sliding into a future cycle.", changes: ["Pinned First 2W, Second 2W, and 1M tasks to the Friday-through-Sunday weekend assigned when each task is created.", "Stopped routine refreshes and rolling-plan reconciliation from moving an unfinished task into a later weekend.", "Kept missed assigned weekends active and marked them overdue beginning Monday.", "Made a manual date outside the assigned weekend act as its explicit deadline.", "Preserved deliberate reset, revert, and cycle-setting changes as new schedule assignments without altering completed history."] },
          { id: "v175-revert-stage-exclusivity", version: 175, date: "2026-08-31", type: "Revision fix", title: "Reverting to MLE no longer duplicates 1-Day Revision", summary: "A block can no longer show an active MLE and a later revision stage at the same time after Revert stage.", changes: ["Stopped schedule refresh from recreating 1-Day Revision while a reverted MLE is active.", "Made an active Pre-study or MLE stage authoritative over every later revision stage for the same block.", "Automatically superseded duplicate active revision rows already created by this bug without deleting history, notes, confidence, or completed sessions.", "Covered normal and assessment-specific schedules with the same pipeline rule."] },
          { id: "v174-mle-time-removed-one-day-estimates", version: 174, date: "2026-08-31", type: "Timing improvement", title: "MLE timing is removed and 1-Day estimates are explicit", summary: "MLEs no longer record time spent, while active 1-Day revisions can carry a planning estimate before completion.", changes: ["Removed Time spent from active and completed MLE rows while retaining MLE confidence and dates.", "Stopped individual and Study Pile MLE completion from creating time records.", "Removed obsolete saved MLE-minute values without changing MLE completion, confidence, notes, or progression history.", "Changed the active 1-Day timing field to Estimated time so workload projections can be entered before completion.", "Kept the estimate separate from actual Time spent; completing the revision does not silently record the estimate as actual work."] },
          { id: "v173-specific-weekend-deadlines", version: 173, date: "2026-08-31", type: "Scheduling fix", title: "End-week revisions now belong to one specific weekend", summary: "First 2W, Second 2W, and 1M revisions now run from Friday through Sunday and become overdue after that weekend ends.", changes: ["Assigned every normal end-week revision a concrete Friday-through-Sunday date range.", "Kept an end-week task due throughout Sunday, even when a manual study date inside the weekend was selected.", "Marked unfinished First 2W, Second 2W, and 1M tasks overdue beginning Monday.", "Re-anchored existing active end-week tasks to the corrected Sunday deadline without altering completed history.", "Applied the same deadline rule across Home, Study, Calendar, account status, and reminder calculations."] },
          { id: "v172-dated-revision-completion", version: 172, date: "2026-08-30", type: "Study workflow", title: "Record a revision completed on another date", summary: "Study now has compact calendar controls for scheduling and accurately recording a revision you completed earlier.", changes: ["Replaced the text Schedule action in Study with a compact calendar icon and a clear hover description.", "Added a calendar-check button immediately after each revision's Complete button.", "The new completion path requires the actual completed date and rejects future dates.", "Date-only completions appear in history without inventing a completion time.", "The selected completion date drives subsequent revision timing wherever progression depends on the completed day; the normal Complete button is unchanged."] },
          { id: "v171-remove-highlight-slivers", version: 171, date: "2026-08-29", type: "Writing fix", title: "Empty highlight slivers are removed", summary: "Pressing Enter at the end of highlighted text now moves the line break and caret completely outside the highlight wrapper.", changes: ["Moved trailing line-break nodes outside highlighted spans instead of leaving an empty colored fragment.", "Placed the caret in a plain unformatted text node after the new line so subsequent typing cannot inherit highlighting.", "Unwrapped empty highlight wrappers containing only line breaks, spaces, or browser marker characters.", "Cleaned previously saved slivers automatically while preserving their intended line breaks.", "Kept real highlighted text, saved notes, and all other formatting intact."] },
          { id: "v170-highlight-enter-blackout", version: 170, date: "2026-08-28", type: "Writing fix", title: "Enter exits highlights cleanly", summary: "Starting a new line after highlighted text no longer carries the highlight forward, and blackout covers cannot reveal white text.", changes: ["Cleared active highlighting both before and immediately after Enter or Shift+Enter creates a new line.", "Added an Enter-key fallback for browsers that inconsistently report rich-text input events.", "Forced blackout covers to use an opaque fill and matching text color.", "Masked nested bold, underline, link, and browser-generated formatting inside blackout text.", "Kept existing highlight colors, palette behavior, and saved content intact."] },
          { id: "v169-persistent-highlight-palette", version: 169, date: "2026-08-27", type: "Writing", title: "The highlight palette stays open", summary: "Apply, change, or remove highlights repeatedly without reopening the color menu after every action.", changes: ["Kept the highlight palette open after choosing any color.", "Kept it open after using Remove highlight.", "Made the main Highlight button the deliberate open and close control.", "Preserved the selected text and existing highlight toggle behavior."] },
          { id: "v168-visible-blackout-highlight", version: 168, date: "2026-08-27", type: "Writing", title: "Blackout highlights are easier to see", summary: "Concealed text now uses a distinct medium-slate cover that remains unreadable without blending into the editor background.", changes: ["Lightened the blackout cover enough to stand apart from the dark editor.", "Kept concealed text the same color as its cover so the content remains hidden.", "Added a subtle inner edge that clearly marks the covered region.", "Migrated existing saved blackout formatting to the improved appearance automatically.", "Left the other highlight colors and click-again-to-remove behavior unchanged."] },
          { id: "v167-custom-session-slots", version: 167, date: "2026-08-26", type: "Custom Sessions", title: "Custom Session placement is unambiguous", summary: "Choose one slot between revision stages without duplicate before/after options or same-day false alarms.", changes: ["Replaced the related-window and before/during/after controls with one placement-in-revision-order selector.", "Removed During as an option.", "Represented each location once, such as Between 1-Day Revision and First 2W Revision.", "Allowed a Custom Session to share a date with an adjacent revision window without warning.", "Limited warnings to dates clearly outside the two adjacent windows.", "Mapped existing Custom Sessions into the matching new slot without deleting their schedule, time, notes, status, or history."] },
          { id: "v166-custom-session-pipeline", version: 166, date: "2026-08-26", type: "Study workflow", title: "Custom Sessions now sit inside the revision order", summary: "Inserted study work now appears between normal revision stages and holds later rows until it is completed or skipped.", changes: ["Renamed Extra Sessions to Custom Sessions and removed custom session names from Study rows.", "Added collapsible Custom Sessions sections only where unfinished custom work exists.", "Placed each section before, during, or after its selected normal revision stage.", "Temporarily hid later normal Study, Home, and Calendar rows until the inserted session is completed or skipped, without rewriting the saved revision schedule.", "Used the block techniques already planned for the related revision window instead of assigning separate techniques to a Custom Session.", "Moved planned Custom Session timing and controls into the block's existing Session time and history area."] },
          { id: "v165-extra-sessions", version: 165, date: "2026-08-26", type: "Study workflow", title: "Extra Sessions add independent study work", summary: "Schedule additional block sessions before, during, or after a revision window without changing the block's real revision progression.", changes: ["Added multiple editable Extra Sessions to every block in Study and the block workspace.", "Related each session to a projected revision window with before, during, or after placement, an editable exact date, and a schedule warning when the date conflicts.", "Recorded independent confidence, time, notes, and actual technique usage, with completed records remaining editable.", "Added Extra Sessions to Home workload, Study sections, Calendar, calendar subscriptions, Log, Insights, account sync, imports, exports, and Undo/Redo.", "Kept Extra Sessions in a separate data collection and verified that completion cannot progress, reset, pause, reschedule, or otherwise mutate revision tasks."] },
          { id: "v164-actionable-home-time", version: 164, date: "2026-08-26", type: "Home accuracy", title: "Home time reflects the current workload", summary: "Total estimated time now includes only revision blocks whose window has opened or that are overdue.", changes: ["Excluded future revision blocks whose windows have not started.", "Included revisions currently inside their recommended or manually scheduled window.", "Continued to include overdue revision work until it is completed, skipped, paused, or otherwise leaves the active workload.", "Kept Pre-study and MLE outside the revision-time total.", "Left the full upcoming task list and all schedules unchanged."] },
          { id: "v163-active-revision-time", version: 163, date: "2026-08-26", type: "Timing fix", title: "Active revision time saves before completion", summary: "Time entered from an open block now persists during an active MLE or revision and carries into its completed session.", changes: ["Added an In progress timing row for every active MLE or revision in the block workspace.", "Used the existing session-time autosave setting for active timing and retained the manual Save session changes option.", "Showed saved active time immediately in Study, Home totals, and Study Pile totals.", "Pre-filled individual and pile completion forms with the saved active time.", "Moved the saved value into completed session history when the stage is completed instead of requiring it again."] },
          { id: "v162-block-time-carries-forward", version: 162, date: "2026-08-26", type: "Timing fix", title: "Entered block times carry forward", summary: "A block's recorded revision time now estimates its next revision stage without borrowing from other blocks.", changes: ["Used exact block-and-stage timing when available.", "Fell back to that same block's other explicitly recorded revision sessions when a new stage has no timing yet.", "Continued to show No time when the block itself has no recorded revision duration.", "Never borrowed timing from another block or a global stage average.", "Updated Home totals and Study Pile totals through the same corrected per-block rule."] },
          { id: "v161-home-total-estimated-time", version: 161, date: "2026-08-26", type: "Home overview", title: "Home totals the active revision workload", summary: "The Home metrics now include the total known time for all active revision tasks shown on the page.", changes: ["Added a Total estimated time metric beside Due today, Overdue, and Active blocks.", "Summed only exact block-and-stage timing that has already been recorded.", "Counted active Study Pile shared work once instead of repeating it for every member.", "Excluded Pre-study and MLE work because those stages do not record revision time.", "Displayed entered time alongside the number of active items with No time whenever the total is incomplete."] },
          { id: "v160-no-borrowed-time-estimates", version: 160, date: "2026-08-26", type: "Timing accuracy", title: "Missing times stay missing", summary: "Study no longer borrows timing from other stages or blocks when no time was recorded for the current work.", changes: ["Showed No time when the current block and revision stage have no explicitly recorded duration.", "Stopped using a block's other revision stages as fallback timing.", "Stopped using other blocks' sessions as fallback timing.", "Kept an estimate only when that exact block and revision stage already has recorded time.", "Made partial pile totals distinguish entered time from members with no time instead of presenting an incomplete number as the total."] },
          { id: "v159-pile-revision-planning-calendar", version: 159, date: "2026-08-25", type: "Study Piles planning", title: "Pile setup previews revision windows against tests", summary: "Study Pile creation and editing now includes a calendar of normal unit revision windows and assessment dates.", changes: ["Added a compact month calendar to the Study Pile form with previous and next month navigation.", "Showed 1-Day, First 2W, Second 2W, and 1M windows for every active block in the selected members' units.", "Accented unit tests separately and defaulted the calendar to the nearest relevant upcoming assessment month.", "Flagged normal revision windows that land after an upcoming test so an earlier custom schedule can be considered.", "Updated the calendar immediately when pile members change, without altering any block, task, window, or assessment date."] },
          { id: "v158-unit-block-mle-order", version: 158, date: "2026-08-25", type: "Subjects organization", title: "Unit blocks follow MLE date", summary: "Blocks inside each unit now appear from the newest assigned MLE date to the oldest.", changes: ["Sorted blocks inside units by assigned MLE date with the newest date first.", "Placed blocks without an assigned MLE date after all dated blocks.", "Kept the existing manual order as the tie-breaker when multiple blocks share the same MLE date.", "Left standalone blocks, sub-unit ordering, schedules, and saved block data unchanged."] },
          { id: "v157-accented-study-block-names", version: 157, date: "2026-08-25", type: "Study readability", title: "Block names stand out in Study", summary: "Study rows now visually separate the revision window from the actual block name.", changes: ["Placed every Study block name in its own compact accented label.", "Kept the revision stage and Day 0/2 window readable as the leading text.", "Used a restrained outline, tint, and accent edge instead of increasing the whole row's visual weight.", "Allowed long block names to wrap cleanly at standard browser zoom and on mobile.", "No blocks, stages, schedules, confidence, notes, or history were changed."] },
          { id: "v156-save-and-completion-stabilization", version: 156, date: "2026-08-25", type: "Critical stability fix", title: "Saving and stage completion are stable again", summary: "Account sync can no longer detach open editors or completion buttons from the data being saved.", changes: ["Fixed technique notes and block content failing to save after an account sync completed in the background.", "Manual technique-note saves no longer appear to clear content after the interface refreshes.", "Pre-study and MLE completion now resolve the current task by ID and cannot create duplicate sessions or progression from repeated clicks.", "Existing Pre-study or MLE tasks stranded by this issue are repaired from their retained session history without deleting anything.", "Account sync no longer replaces identical local data or saves again on every no-op render.", "Enter and Shift+Enter now use the same compact line spacing while preserving list behavior."] },
          { id: "v155-technique-note-protection", version: 155, date: "2026-08-25", type: "Critical data protection fix", title: "Technique content cannot be cleared by editing a block", summary: "Technique notes are committed before block edits, navigation, rerenders, removals, or preset replacement can rebuild the interface.", changes: ["Opening Edit on a block now preserves every technique-note draft first.", "Leaving a block, opening another control, account refreshes, and other rerenders use the same protection.", "Removing a technique from a block hides its placement but retains its notes; adding it again restores that content.", "Replacing techniques with a preset no longer deletes placement records or their notes.", "Explicit permanent deletion remains the only action designed to erase a technique and still requires its dedicated warning."] },
          { id: "v154-description-consolidation", version: 154, date: "2026-08-25", type: "Block workspace cleanup", title: "Weak points moved into descriptions", summary: "Blocks now use one description editor instead of a separate Gaps & weak points card.", changes: ["Removed the block-level Gaps & weak points section from the block workspace.", "Any existing text from that section is appended to the same block's description without overwriting its current description.", "The migration is repeat-safe and removes the legacy field after its content has been preserved.", "The autosave setting now refers only to block descriptions.", "Session-specific gaps and mistakes remain attached to their original completed revision sessions."] },
          { id: "v153-blank-time-stays-blank", version: 153, date: "2026-08-25", type: "Timing accuracy fix", title: "Blank time entries stay blank", summary: "Predicted durations remain guidance and are no longer silently recorded as actual study time.", changes: ["Individual completion forms now open Time spent blank even when a duration estimate exists.", "Pile shared-time and member-time fields also open blank instead of copying their estimates into editable values.", "Estimates remain visible in explanatory text or placeholders so they can still guide planning.", "Submitting an untouched or cleared time field stores no time rather than zero or an estimated number.", "The optional expected pile time continues to remain blank until a number is explicitly entered."] },
          { id: "v152-mass-add-schedule-context", version: 152, date: "2026-08-25", type: "Planning improvement", title: "Mass add shows the subject schedule", summary: "The multi-date planner now shows existing block MLEs and unit assessments before you choose new dates.", changes: ["Blue count markers identify dates that already contain one or more active blocks in the selected subject.", "Distinct red TEST markers identify assessment dates from every active unit and sub-unit in that subject.", "Hover or focus a marked date to see the exact existing blocks, unit paths, and assessments.", "Changing the destination unit keeps the full subject schedule visible so separate units can be planned together without memorizing dates.", "The indicators are visual only and do not change existing blocks, assessment dates, or scheduling rules."] },
          { id: "v151-reliable-account-sync", version: 151, date: "2026-08-25", type: "Data safety fix", title: "Account sync is reliable across devices", summary: "Large accounts now save normally, interrupted saves retry automatically, and stale devices can no longer silently overwrite newer account data.", changes: ["Removed the unload-only request mode from ordinary saves so larger account snapshots are not rejected by the browser.", "Added automatic retry after temporary network or server failures and immediate recovery of pending saves on startup.", "Added revision checks and three-way merging so non-overlapping changes from multiple devices are preserved.", "Refresh account data when a tab regains focus, returns online, receives a same-device sync signal, or remains open while another device saves.", "Use the stable signed-in account ID while retaining every existing account record and calendar feed.", "Show Synced, Saving, or Retrying status instead of claiming every save already succeeded."] },
          { id: "v150-rich-text-highlight-fix", version: 150, date: "2026-08-25", type: "Writing fix", title: "Rich-text editing is steadier and more flexible", summary: "Enter and Backspace no longer carry an old highlight into new typing, and Highlight now includes a safer color palette.", changes: ["Stopped collapsed carets from being mistaken for selected highlighted text.", "Reset inherited highlighting after paragraph and line-join edits.", "Softened the default yellow and added rose, mint, blue, lavender, peach, blackout, and remove choices.", "Made Ctrl+B, Ctrl+I, and Ctrl+U reliable and replaced the link popup with an inline address field.", "Retested strikethrough, lists, clear formatting, paste sanitization, saving, and display rendering."] },
          { id: "v149-single-line-study-metadata", version: 149, date: "2026-08-22", type: "Layout fix", title: "Study details stay together at 100% zoom", summary: "Task dates, status, timing, and confidence now use the full card width instead of folding prematurely.", changes: ["Moved the metadata strip beneath the title and context so action buttons no longer squeeze it.", "Kept metadata badges on one line at standard desktop widths.", "Preserved intentional wrapping on mobile and compact layouts.", "No blocks, dates, stages, confidence, or history were changed."] },
          { id: "v148-drag-scroll", version: 148, date: "2026-08-22", type: "Drag improvement", title: "Dragging and scrolling now work together", summary: "Handle-based moves can continue across long pages without dropping the item first.", changes: ["Scroll the mouse wheel while holding a six-dot drag handle.", "Move the held item near the top or bottom edge to auto-scroll continuously.", "Auto-scroll works with hierarchy moves and technique arrangement.", "Drag targets, autosave preferences, and saved data behavior are unchanged."] },
          { id: "v147-study-row-responsive-layout", version: 147, date: "2026-08-22", type: "Layout fix", title: "Study controls stay clean at 100% browser zoom", summary: "Study task details and controls now use stable responsive columns instead of folding into each other at normal browser zoom.", changes: ["Kept desktop task controls together on one clean line when space allows.", "Moved the control group below task details as one unit on narrower screens.", "Opened icon descriptions above the controls so they do not cover the completion button.", "Allowed long block names and context to wrap without forcing the controls out of place.", "No blocks, schedules, stages, confidence, or history were changed."] },
          { id: "v146-compact-home-pipeline", version: 146, date: "2026-08-22", type: "Home refinement", title: "The Home pipeline fits without a second task feed", summary: "Block stages and upcoming tests now use compact horizontal grids instead of long full-width rows.", changes: ["Arranged block-stage summaries across available space.", "Changed the five nearest tests into compact assessment tiles that fit side by side.", "Combined each test's countdown and date into one readable line.", "Kept horizontal scrolling on narrow screens instead of stacking every tile vertically.", "No assessments, blocks, schedules, or history were changed."] },
          { id: "v145-home-upcoming-tests", version: 145, date: "2026-08-22", type: "Home improvement", title: "Home now warns about upcoming tests", summary: "The pipeline overview includes the nearest unit assessments instead of showing only block stages.", changes: ["Added an Upcoming tests subsection to Home's pipeline overview.", "Shows the five nearest tests with subject, unit, date, and days remaining.", "Added an upcoming-test count and a direct button to the complete Timeline.", "Archived subjects and units remain excluded.", "No assessment dates, block stages, schedules, or history were changed."] },
          { id: "v144-ordered-assessment-timeline", version: 144, date: "2026-08-22", type: "Timeline improvement", title: "Assessment lanes now follow urgency", summary: "Upcoming exams are ordered nearest first, while completed assessment periods move into a separate retention-maintenance section.", changes: ["Sorted all upcoming assessment lanes globally from the closest exam date to the farthest.", "Moved units past their assessment date into a distinct Retention maintenance category.", "Sorted retention lanes from the most recently passed assessment to the oldest.", "Kept undated planning lanes after dated upcoming assessments.", "No assessment dates, revision schedules, confidence, or history were changed."] },
          { id: "v143-compact-empty-units", version: 143, date: "2026-08-22", type: "Interface refinement", title: "Empty units take up less room", summary: "Expanded empty units now use a compact dashed indicator instead of a large blank area.", changes: ["Reduced the empty-unit state to one clearly labeled compact row.", "Kept the block count visible in every unit header.", "No subjects, units, blocks, schedules, or history were changed."] },
          { id: "v142-compact-interactive-calendar", version: 142, date: "2026-08-22", type: "Calendar improvement", title: "The calendar is compact, navigable, and exam-aware", summary: "Month cells stay fixed in size while selected days open a complete vertical agenda, and exams now stand apart from every other event.", changes: ["Added Previous, Today, and Next controls for moving between calendar months.", "Fixed every calendar day to a consistent height and limited the grid to two abridged event previews plus a remaining-item count.", "Clicking a day opens its complete vertical agenda beneath the month grid.", "Unit exams use a dedicated red treatment, glow, EXAM label, and exam-day accent instead of sharing ordinary revision styling.", "No dates, schedules, assessment records, or history were changed."] },
          { id: "v141-clear-empty-units", version: 141, date: "2026-08-22", type: "Interface improvement", title: "Empty expanded units are unmistakable", summary: "Expanded units now show a larger dashed empty area and every unit header reports its block count.", changes: ["Added a taller, clearly labeled empty state when an expanded unit has no blocks or sub-units.", "Added a block-count badge to each unit and sub-unit header.", "Parent counts include blocks inside nested sub-units so the total represents the full unit hierarchy.", "No subjects, units, blocks, schedules, or history were changed."] },
          { id: "v140-glowing-assessment-badge", version: 140, date: "2026-08-22", type: "Design improvement", title: "Assessment dates now glow red", summary: "The always-visible unit assessment badge has a stronger red glow and clearer visual priority.", changes: ["Changed the assessment accent from soft rose to vivid red.", "Added an exterior red glow, outlined edge, and subtle inner illumination.", "Adjusted light and dark mode colors separately to preserve readability.", "No assessment dates, schedules, ordering, or history were changed."] },
          { id: "v139-single-assessment-badge", version: 139, date: "2026-08-22", type: "Interface fix", title: "Unit assessment dates stay visible without duplication", summary: "Each unit now shows one outlined assessment badge in its always-visible header.", changes: ["Removed the redundant assessment date callout from inside expanded units.", "The header assessment badge remains visible when the unit is collapsed.", "A stronger rose outline and contrast distinguish assessment dates from mode and stage badges.", "No assessment dates, unit ordering, schedules, or history were changed."] },
        { id: "v138-nested-subunits", version: 138, date: "2026-08-22", type: "Organization improvement", title: "Sub-units and handle-only hierarchy moves", summary: "Units can now contain sub-units, and blocks or units can move through the hierarchy from dedicated six-dot handles.", changes: ["Add a sub-unit from any unit or choose a parent unit while creating or editing one.", "Drag blocks into another unit, drag units into another unit to nest them, or drop either on a subject to return it to that subject's top level.", "Only the six-dot handle starts a hierarchy drag, so buttons, text, and editors remain reliably clickable.", "A new Subject hierarchy arrangement setting switches between immediate autosave and an explicit Save hierarchy arrangement workflow.", "Manual mode keeps moves as a reversible draft and blocks unrelated actions until the draft is saved or discarded.", "Parent-unit presets, revision pauses, archiving, deletion, paths, Timeline lanes, selectors, and task context now account for nested descendants."] },
        { id: "v137-units-by-assessment-date", version: 137, date: "2026-08-22", type: "Organization improvement", title: "Units are ordered by assessment date", summary: "Dated units now follow assessment order so the next assessment is easier to find, while archived content stays out of active selectors.", changes: ["Units are sorted from earliest to latest assessment date within each subject.", "Units without an assessment date appear after dated units.", "Units sharing the same assessment date retain their manual order.", "The same ordering is used in Subjects, Timeline lanes, block unit selectors, and Mass add blocks.", "Archived subjects, units, and blocks no longer appear as choices in creation, editing, mass-add, or preset-assignment forms.", "No unit data, schedules, or revision history is changed by this display-only ordering."] },
        { id: "v136-unit-exam-focus-ramp", version: 136, date: "2026-08-22", type: "Timeline improvement", title: "Unit exam ramps show how retrieval should narrow", summary: "Timeline lanes now follow individual units and visualize the shift from broad higher-volume work to targeted retrieval before each unit exam.", changes: ["Each lane is labeled with its subject and unit instead of combining the whole subject into one row.", "Broad Build covers the early period, Focused Mix covers days 28 through 8 before the exam, and Precision Retrieval covers the final 7 days.", "The ramp describes volume and targeting without changing techniques, stages, confidence, or existing schedules.", "Click an exam marker to edit the same unit exam date used throughout the app.", "Unit assessment dates now use a distinct rose-accented calendar strip instead of blending into the unit background.", "Standalone blocks remain on a separate subject lane when they do not belong to a unit."] },
        { id: "v135-prestudy-timeline-start", version: 135, date: "2026-08-22", type: "Timeline improvement", title: "Each subject timeline now has a clear starting point", summary: "The earliest Pre-study date is marked as the beginning of its subject's revision timeline.", changes: ["The first Pre-study marker is labeled START · Pre-study and receives a distinct teal origin line.", "A Subject start legend key separates the origin from ordinary Pre-study events.", "The starting point stays visible after Pre-study is completed so the subject timeline retains its historical origin.", "If several blocks share the first Pre-study date, the starting marker groups them together and shows the count."] },
        { id: "v134-cursor-pinch-timeline-zoom", version: 134, date: "2026-08-22", type: "Timeline improvement", title: "Timeline zoom now follows the exact day you point at", summary: "Scroll directly over the timeline on a computer or pinch with two fingers on mobile to inspect exact dates without losing your place.", changes: ["Normal vertical mouse-wheel and trackpad scrolling now zooms instead of requiring the Ctrl key.", "Desktop zoom stays anchored to the date beneath the pointer.", "Two-finger mobile pinching zooms around the date between both fingers and supports panning during the gesture.", "The closer zoom range has been expanded so individual days are easier to inspect, while horizontal and Shift-wheel movement still pans through time."] },
        { id: "v133-infinite-subject-timeline", version: 133, date: "2026-08-22", type: "New view", title: "Subject timelines make the predicted schedule visible", summary: "A new Timeline tab lays out each active subject against an infinitely pannable and zoomable study calendar.", changes: ["Every active subject receives its own horizontal lane.", "Scheduled Pre-study, MLE, and revision tasks appear alongside later predicted 1-Day, First 2W, Second 2W, and 1M windows.", "Same-day items cluster into readable count markers with block details on hover.", "Drag or use the keyboard to pan; use the mouse wheel, a two-finger pinch, or the visible controls to zoom, fit the schedule, or return to today."] },
        { id: "v132-archived-subject-study-filter", version: 132, date: "2026-08-22", type: "Archive fix", title: "Archived subjects fully freeze their study hierarchy", summary: "Archiving a subject now archives every unit and block inside it, freezes their active tasks, and removes them from Study and Home without deleting their records.", changes: ["Subject and unit archiving now cascades through contained units and blocks.", "Automatic scheduling, date refreshes, and overdue status updates skip archived hierarchies.", "Study and Home no longer show Pre-study, MLE, revision, paused revision, or scheduling rows from archived content.", "Calendar entries and completed history remain preserved; unarchiving restores only descendants that were archived by that parent."] },
        { id: "v131-highlight-toggle-date-default", version: 131, date: "2026-08-14", type: "Writing and display fix", title: "Highlight now toggles and dates default to month first", summary: "Pressing Highlight again removes highlighting, and the default date display is now month/day/year.", changes: ["Selecting highlighted text and pressing Highlight again removes only its highlight while preserving bold, underline, links, and the text itself.", "New accounts and accounts without a saved date preference now display dates as month/day/year.", "Explicitly selected day/month/year and year/month/day preferences remain unchanged."] },
        { id: "v130-settings-lag-hotfix", version: 130, date: "2026-08-13", type: "Performance fix", title: "Severe input lag fixed", summary: "Older accounts now receive the midnight study-day default instantly instead of repeatedly reloading settings.", changes: ["Fixed a recursive settings fallback introduced with the custom study-day boundary.", "Typing, clicking, selecting dates, and other controls respond normally again.", "No subjects, blocks, schedules, notes, settings, or history were deleted or rewritten.", "The custom study-day boundary and rich-text tools remain available."] },
        { id: "v129-custom-study-day-boundary", version: 129, date: "2026-08-13", type: "Scheduling improvement", title: "Your study day can end after midnight", summary: "Choose when one study day ends and the next begins, with midnight remaining the default.", changes: ["Settings now includes a Day ends / next day starts time. For example, 2:00 AM makes work from midnight through 1:59 AM part of the previous study day.", "Due-today, overdue, 1-Day Revision windows, completion progression, reset and revert anchors, calendar today, cycle position, and phone reminder calculations use the chosen boundary.", "Assigned MLE and revision dates stay fixed; changing the boundary does not rewrite scheduled dates or completion timestamps.", "The day end and next day start use one shared time so the schedule cannot contain a gap or overlapping study days."] },
        { id: "v128-rich-text-editing", version: 128, date: "2026-08-13", type: "Writing improvement", title: "Formatting tools added to every multiline text area", summary: "Descriptions, notes, weak points, reasons, and the notebook now support familiar rich-text formatting.", changes: ["Every multiline editor includes Bold, Italic, Underline, Highlight, Strikethrough, bulleted list, numbered list, link, and clear-formatting controls.", "Existing plain text remains intact and becomes formatted only when you edit it.", "Formatted session notes and revision reasons render properly in history and the Log.", "Formatting is sanitized before storage and continues to work with account sync, import/export, autosave, Undo, and Redo."] },
        { id: "v127-reset-pause-order", version: 127, date: "2026-08-13", type: "Interface improvement", title: "Reset and Pause controls swapped", summary: "Revision action controls now place Reset before Revert and Pause after Revert.", changes: ["The action order is now Reset, Revert, Pause, Skip wherever those controls are available.", "The controls keep their existing icons, hover descriptions, confirmations, and behavior."] },
        { id: "v126-data-only-undo-redo", version: 126, date: "2026-08-12", type: "Data safety improvement", title: "Undo and Redo now follow real data changes", summary: "History now focuses on committed account changes instead of temporary interface movement.", changes: ["Opening, collapsing, navigating, filtering, changing the theme, reading updates, and hiding account details no longer create Undo entries.", "Saved and autosaved typing remains undoable, with continuous typing grouped into meaningful edits instead of one step per keystroke.", "A compact Redo control restores the latest undone data change after confirmation.", "Making a new data change after Undo clears the old Redo branch so stale snapshots cannot overwrite newer work."] },
        { id: "v125-consistent-updates-inbox", version: 125, date: "2026-08-12", type: "Interface fix", title: "Updates Inbox now stays compact on every page", summary: "The Subjects header no longer stretches the Updates Inbox to match larger creation controls.", changes: ["Updates Inbox uses one consistent compact size across Home, Study, Subjects, and the other top-level pages.", "Subjects header actions now align independently instead of stretching to the tallest adjacent action.", "Unread counts and the quiet gray all-read state work exactly as before."] },
        { id: "v124-simpler-home-notifications-paused", version: 124, date: "2026-08-12", type: "Interface simplification", title: "Home is clearer and notifications are paused", summary: "Home now presents block-level status at a glance while the unfinished notification interface is hidden.", changes: ["Notifications has been removed from navigation and notification controls are hidden from Settings for now.", "Direct browser notification registration and badges are disabled without deleting saved notification data.", "Due now is replaced by separate Due today and Overdue counts.", "Live tasks is replaced by Active blocks, which counts each non-archived block only once."] },
        { id: "v123-study-mle-editor", version: 123, date: "2026-08-12", type: "Study workflow improvement", title: "MLE dates can be edited directly from Study", summary: "The active MLE row now edits the same assigned date used by the block in Subjects.", changes: ["Active MLE rows include a clear Edit MLE button beside Open.", "Study and Subjects now use the same schedule-update function and the same block MLE field.", "Changing the date refreshes the MLE task and any active MLE-anchored revision schedule without deleting history.", "When Pre-study is configured to use the MLE date, its due date changes with the MLE too."] },
        { id: "v122-complete-revert-chain", version: 122, date: "2026-08-12", type: "Study workflow fix", title: "1-Day Revision now has its missing Revert control", summary: "The backward workflow now forms a complete chain from revision through MLE to Pre-study.", changes: ["1-Day Revision now shows the video-style rewind control.", "Reverting 1-Day returns the block to its Main Learning Event without changing the assigned MLE date or deleting history.", "Reverting the reopened MLE continues backward to Pre-study.", "The Revert button is now shown whenever the active stage has a valid previous workflow step."] },
        { id: "v121-revert-mle-skip-stages", version: 121, date: "2026-08-12", type: "Study workflow improvement", title: "MLE can be reverted and every stage can be skipped", summary: "Stage controls now support honest backward and forward exceptions without inventing completed work.", changes: ["Revert on an active MLE reopens Pre-study while preserving the original MLE date and all earlier history.", "Every active Pre-study, MLE, and revision stage has a mirrored fast-forward Skip control.", "Skipping advances the workflow but records no completion session, confidence, time, gaps, notes, or technique use.", "Each skip is recorded with its date, time, optional reason, and resulting next stage in Stage history and the Log."] },
        { id: "v120-universal-revision-scheduling", version: 120, date: "2026-08-12", type: "Revision scheduling improvement", title: "Every revision stage can be scheduled manually", summary: "Manual date overrides now work consistently across 1-Day, both 2W stages, 1M, and assessment revision.", changes: ["Every active revision row now includes a Schedule button.", "The scheduling screen shows the stage's recommended date or window and clearly warns before an outside-window override is saved.", "Clearing an override restores the stage's automatic schedule without changing its MLE anchor or revision history.", "Revert now uses a distinct video-style rewind icon so it no longer resembles Undo."] },

      if (hadPendingSync) setTimeout(() => queueAccountSync(0), 0); else setTimeout(pullAccountState, 600);
    </script>
  </body>
</html>
